services:
  db:
    # Multi-arch (amd64 + arm64) PostGIS build, so it runs natively on Apple Silicon
    # instead of under QEMU emulation. Same PostgreSQL 18 / PostGIS 3.6 as the
    # official postgis/postgis image, which is amd64-only.
    image: imresamu/postgis:18-3.6
    container_name: ridebook-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ridebook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ridebook}
      POSTGRES_DB: ${POSTGRES_DB:-ridebook}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - ridebook-db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ridebook} -d ${POSTGRES_DB:-ridebook}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ridebook-db-data:
